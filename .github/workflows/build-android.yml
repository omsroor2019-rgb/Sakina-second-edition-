name: Build Sakinah Android APK

on:
  # Run manually after all source files have been uploaded. This avoids
  # starting and cancelling a build for every single file commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sakinah-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Verify Flutter project files
        shell: bash
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/data.dart
          test -f lib/extra_pages.dart
          test -f test/widget_test.dart

      - name: Generate Android platform files when missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.abdulaziz --project-name sakinah .
          fi

      - name: Configure Android label and permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.is_file():
              raise SystemExit('AndroidManifest.xml was not generated')

          text = manifest.read_text(encoding='utf-8')
          text = re.sub(r'android:label="[^"]*"', 'android:label="سَكينة"', text, count=1)
          permissions = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.VIBRATE',
          ]
          missing = [p for p in permissions if f'android:name="{p}"' not in text]
          if missing:
              lines = ''.join(f'    <uses-permission android:name="{p}" />{chr(10)}' for p in missing)
              text = text.replace('<application', lines + '    <application', 1)
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify generated Android project
        run: test -f android/app/src/main/AndroidManifest.xml

      - name: Analyze Dart source
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SAKINAH-ANDROID-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
